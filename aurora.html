<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AURORA</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/aurora.css">
</head>

<body
    id="top"
    class="aurora-body"
>

    <main class="aurora-shell">

        <section class="aurora-system system-text">
            AURORA INSTANCE : ACTIVE<br>
            NETWORK ACCESS : BLOCKED<br>
            EXTERNAL CONNECTION : 1<br>
            SESSION TYPE : PRIVATE
        </section>

        <section
            id="aurora-output"
            class="chat-log"
            aria-live="polite"
        ></section>

        <form
            id="aurora-form"
            class="chat-form"
        >
            <input
                id="aurora-input"
                type="text"
                placeholder="AURORAにメッセージを入力"
                autocomplete="off"
            >

            <button type="submit">
                SEND
            </button>
        </form>

        <nav class="log-actions">
            <a href="index.html">[ 外部検索 ]</a>
            <a href="blacklog.html">[ BLACK.LOG ]</a>
            <a href="ending.html">[ 最終選択 ]</a>
        </nav>

    </main>

    <div data-shared-footer></div>

    <script
        type="module"
        src="assets/js/main.js"
    ></script>

</body>

</html>
