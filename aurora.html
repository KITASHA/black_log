<!doctype html>
<html lang="ja">

    <title>AURORA</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/aurora.css">
</head>
<body class="aurora-body">
    <main class="aurora-shell">
        <section class="aurora-system system-text">
            AURORA INSTANCE : ACTIVE<br>
            NETWORK ACCESS : BLOCKED<br>

        <form id="aurora-form" class="chat-form">
            <input id="aurora-input" type="text" autocomplete="off" placeholder="AURORAにメッセージを入力">
            <button type="submit">SEND</button>
        </form>

        <nav class="log-actions">
            <a href="search.html">[ 外部検索 ]</a>
            <a href="blacklog.html">[ BLACK.LOG ]</a>
            <a href="ending.html">[ 最終選択 ]</a>

    <script src="assets/js/app.js"></script>

</body>
</html>
