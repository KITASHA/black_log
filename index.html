<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Search</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="search-page" id="top">

    <main class="search-shell">

        <a class="search-logo" href="index.html">
            Search
        </a>

        <form class="search-form" id="search-form">

            <input
                id="search-input"
                type="search"
                placeholder="キーワードを入力"
                autocomplete="off"
                autofocus
            >

            <button type="submit">
                検索
            </button>

        </form>

        <section id="search-results"></section>
        <div class="app-links">

            <a
                class="app-link"
                href="now.html"
                aria-label="Nowを開く"
            >
                <img
                    class="app-icon"
                    src="assets/img/photos/now_icon.png"
                    alt="Now"
                >
            </a>

            <a
                id="blacklog-app"
                class="app-link hidden"
                href="blacklog.html"
                aria-label="BLACK.LOGを開く"
            >
                <img
                    class="app-icon"
                    src="assets/img/photos/blacklog_icon.png"
                    alt="BLACK.LOG"
                >
            </a>

        </div>

    </main>


    <div data-shared-footer></div>


    <script src="assets/js/app.js"></script>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/components.js"></script>

</body>
</html>
