<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Search</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body
    id="top"
    class="search-page"
>

    <main class="search-shell">

        <a
            class="search-logo"
            href="index.html"
        >
            Search
        </a>


        <div class="app-links">

            <a
                class="app-link"
                href="now.html"
            >
                <img
                    class="app-icon"
                    src="assets/img/icon/now_icon.png"
                >
            </a>

            <a
                id="blacklog-app"
                class="app-link hidden"
                href="blacklog.html"
            >
                <img
                    class="app-icon"
                    src="assets/img/icon/blacklog_icon.png"
                >
            </a>

            <a
                id="selenoa-app"
                class="app-link hidden"
                href="selenoa/index.html"
            >
                <img
                    class="app-icon"
                    src="assets/img/icon/selenoa_icon.png"
                >
            </a>

            <a
                id="interview-app"
                class="app-link hidden"
                href="interview.html"
            >
                <img
                    class="app-icon"
                    src="assets/img/icon/interview_icon.png"
                >
            </a>

        </div>


        <form
            id="search-form"
            class="search-form"
        >

            <input
                id="search-input"
                type="search"
                placeholder="キーワードを入力"
                autocomplete="off"
                autofocus
            >

            <button type="submit">
                検索
            </button>

        </form>


        <section id="search-results"></section>

    </main>


    <div data-shared-footer></div>


    <script
        type="module"
        src="assets/js/main.js"
    ></script>

</body>

</html>
