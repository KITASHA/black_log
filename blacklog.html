<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BLACK.LOG</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/blacklog.css">
</head>
<body class="blacklog-body">
    <main class="blacklog-wrap">
        <header class="blacklog-head">
            <div>
                <h1 class="blacklog-title">BLACK.LOG</h1>
                <p class="muted">external viewer / read-only session</p>
            </div>
            <div class="blacklog-status">
                SESSION 01<br>
                UNKNOWN ORIGIN<br>
                READ ACCESS ONLY
            </div>
        </header>

        <section id="blacklog-lines" class="log-panel" aria-live="polite"></section>

        <section id="auth-panel" class="auth-box hidden">
            <span class="auth-label">AURORA AUTHENTICATION</span>
            <p class="auth-hint">HINT：彼女自身</p>
            <form id="blacklog-auth" class="auth-form">
                <input
                    id="blacklog-password"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    maxlength="8"
                    aria-label="半角大文字アルファベット8文字"
                    placeholder="________"
                >
                <button type="submit">AUTH</button>
            </form>
            <p class="muted">半角大文字アルファベット8文字</p>
            <p id="blacklog-message" class="auth-message" aria-live="polite"></p>
        </section>

        <nav class="log-actions">
            <a href="search.html">[ 外部検索を開く ]</a>
            <a href="index.html">[ SNSへ戻る ]</a>
        </nav>
    </main>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/blacklog.js"></script>
</body>
</html>
